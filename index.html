<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Music Player</title>
  <link rel="shortcut icon" href="images/echo-logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAF7F1;
      color: #4A443A;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .player {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    h1, h2, h3 { font-weight: 600; }

    .config-error {
      background: #EFE9DE;
      border: 1px solid #DDD4C4;
      padding: 24px;
      color: #8C8272;
      text-align: center;
    }

    /* Now playing panel */
    .now-playing {
      background: #EFE9DE;
      padding: 32px;
    }

    .track-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 500;
      color: #4A443A;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .track-artist {
      color: #8C8272;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 4px;
      background: #DDD4C4;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #B5623E;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #8C8272;
      font-size: 0.82rem;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #4A443A;
      color: #FAF7F1;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 140ms;
    }

    .play-btn:hover { background: #5e564b; }
    .play-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .skip-btn {
      background: none;
      border: none;
      color: #8C8272;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 8px;
    }

    .skip-btn:hover { color: #4A443A; }

    /* Upload area */
    .upload-section {
      background: #EFE9DE;
      padding: 24px;
    }

    .upload-zone {
      border: 2px dashed #DDD4C4;
      border-radius: 8px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 140ms;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: #B5623E;
    }

    .upload-zone img {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
      opacity: 0.6;
    }

    .upload-zone strong {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4A443A;
    }

    .upload-zone small {
      color: #8C8272;
      font-size: 0.84rem;
    }

    .upload-zone input[type="file"] { display: none; }

    .upload-success {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #B5623E;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 12px;
      opacity: 0;
      transition: opacity 300ms;
    }

    .upload-success.visible { opacity: 1; }

    /* Library */
    .library {
      background: #EFE9DE;
      padding: 24px;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .library-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .track-count {
      color: #8C8272;
      font-size: 0.84rem;
    }

    .track-list {
      display: flex;
      flex-direction: column;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid #DDD4C4;
      cursor: pointer;
      transition: opacity 100ms;
    }

    .track-item:first-child { border-top: none; }

    .track-info { min-width: 0; flex: 1; }

    .track-info-title {
      font-weight: 500;
      color: #4A443A;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-info-meta {
      color: #8C8272;
      font-size: 0.84rem;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-item.active .track-info-title { color: #B5623E; }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #8C8272;
      font-size: 0.84rem;
      cursor: pointer;
      padding: 4px 8px;
      font-family: inherit;
    }

    .delete-btn:hover { color: #4A443A; }

    .track-duration {
      color: #8C8272;
      font-size: 0.84rem;
      width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    .empty-state {
      color: #8C8272;
      font-size: 0.9rem;
      text-align: center;
      padding: 32px 0;
    }

    .now-playing-icon {
      margin-bottom: 8px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="player">
    <!-- Now playing panel -->
    <section class="now-playing">
      <div class="now-playing-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A443A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="#4A443A" stroke="none"/></svg>
      </div>
      <h1 class="track-title" id="nowTitle">Select a track</h1>
      <p class="track-artist" id="nowArtist"></p>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </section>

    <!-- Playback controls -->
    <section class="controls">
      <button class="skip-btn" id="skipBack" title="Rewind 10 seconds" aria-label="Rewind 10 seconds">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" disabled aria-label="Play">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="skip-btn" id="skipForward" title="Forward 10 seconds" aria-label="Forward 10 seconds">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
      </button>
    </section>

    <!-- Upload area -->
    <section class="upload-section">
      <div class="upload-zone" id="uploadZone">
        <img src="images/svg icons/cloud-upload.svg" alt="Upload" />
        <strong>Upload music</strong>
        <small>Drag &amp; drop audio files, or click to browse</small>
        <input type="file" id="fileInput" accept="audio/*" multiple />
      </div>
      <div class="upload-success" id="uploadSuccess">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5623E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Upload complete
      </div>
    </section>

    <!-- Library -->
    <section class="library">
      <div class="library-header">
        <h2>Library</h2>
        <span class="track-count" id="trackCount"></span>
      </div>
      <div class="track-list" id="trackList"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/echo-api.js"></script>
  <script>
    // ── State ──
    let tracks = [];
    let currentTrack = null;
    let isPlaying = false;
    let audio = new Audio();
    let uploadSuccessTimer = null;

    // ── DOM refs ──
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const skipBack = document.getElementById('skipBack');
    const skipForward = document.getElementById('skipForward');
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const uploadSuccess = document.getElementById('uploadSuccess');
    const trackList = document.getElementById('trackList');
    const trackCount = document.getElementById('trackCount');

    // ── Init ──
    async function init() {
      if (!EchoAPI.configLooksReady()) {
        renderConfigError();
        return;
      }
      audio.addEventListener('timeupdate', onTimeUpdate);
      audio.addEventListener('ended', onEnded);
      audio.addEventListener('loadedmetadata', onMetadataLoaded);
      setupUpload();
      await loadTracks();
    }

    function renderConfigError() {
      nowTitle.textContent = 'Supabase not configured';
      nowArtist.textContent = 'Add SUPABASE_URL and SUPABASE_ANON_KEY to js/env.js or set environment variables.';
      uploadZone.style.display = 'none';
      trackList.innerHTML = '';
    }

    async function loadTracks() {
      try {
        tracks = await EchoAPI.getAllTrackRecords();
        renderLibrary();
      } catch (err) {
        console.error('Failed to load tracks:', err);
        trackList.innerHTML = '<div class="empty-state">Could not load tracks. Check your Supabase connection.</div>';
      }
    }

    // ── Library rendering ──
    function renderLibrary() {
      trackCount.textContent = tracks.length + (tracks.length === 1 ? ' track' : ' tracks');

      if (!tracks.length) {
        trackList.innerHTML = '<div class="empty-state">No tracks yet. Upload some music to get started.</div>';
        return;
      }

      trackList.innerHTML = '';
      tracks.forEach(function (track) {
        var item = document.createElement('div');
        item.className = 'track-item' + (currentTrack && currentTrack.id === track.id ? ' active' : '');
        item.innerHTML =
          '<div class="track-info">' +
            '<div class="track-info-title">' + escapeHtml(track.title) + '</div>' +
            '<div class="track-info-meta">' +
              (track.artist ? escapeHtml(track.artist) + ' · ' : '') +
              (track.duration_seconds ? formatTime(track.duration_seconds) : track.sizeLabel || '') +
            '</div>' +
          '</div>' +
          '<span class="track-duration">' + (track.duration_seconds ? formatTime(track.duration_seconds) : '') + '</span>' +
          '<div class="track-actions">' +
            '<button class="delete-btn" data-id="' + track.id + '" title="Delete track">Delete</button>' +
          '</div>';

        item.querySelector('.track-info').addEventListener('click', function () {
          playTrack(track);
        });
        item.querySelector('.delete-btn').addEventListener('click', function (e) {
          e.stopPropagation();
          deleteTrack(track.id);
        });

        trackList.appendChild(item);
      });
    }

    // ── Playback ──
    async function playTrack(track) {
      // If same track, toggle
      if (currentTrack && currentTrack.id === track.id) {
        if (audio.paused) {
          audio.play();
          isPlaying = true;
          updatePlayBtn();
        } else {
          audio.pause();
          isPlaying = false;
          updatePlayBtn();
        }
        return;
      }

      currentTrack = track;
      nowTitle.textContent = track.title;
      nowArtist.textContent = track.artist || '';
      playBtn.disabled = false;

      // Get fresh signed URL
      var src = track.src;
      if (!src && track.file_path) {
        try {
          src = await EchoAPI.signedUrlFor(track.file_path);
        } catch {
          src = '';
        }
      }

      if (!src) {
        nowTitle.textContent = track.title;
        nowArtist.textContent = 'Could not generate playback URL';
        return;
      }

      audio.src = src;
      audio.play().then(function () {
        isPlaying = true;
        updatePlayBtn();
        renderLibrary();
      }).catch(function (err) {
        console.error('Playback error:', err);
        nowArtist.textContent = 'Playback error';
      });

      renderLibrary();
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updatePlayBtn();
    }

    function updatePlayBtn() {
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = '';
        playBtn.setAttribute('aria-label', 'Pause');
      } else {
        playIcon.style.display = '';
        pauseIcon.style.display = 'none';
        playBtn.setAttribute('aria-label', 'Play');
      }
    }

    function skip(seconds) {
      if (!audio.duration) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
    }

    function onTimeUpdate() {
      if (!audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
      totalTimeEl.textContent = formatTime(audio.duration);
    }

    function onMetadataLoaded() {
      totalTimeEl.textContent = formatTime(audio.duration);
    }

    function onEnded() {
      isPlaying = false;
      updatePlayBtn();
    }

    // Click on progress bar to seek
    progressBar.addEventListener('click', function (e) {
      if (!audio.duration) return;
      var rect = progressBar.getBoundingClientRect();
      var pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    });

    playBtn.addEventListener('click', togglePlay);
    skipBack.addEventListener('click', function () { skip(-10); });
    skipForward.addEventListener('click', function () { skip(10); });

    // Keyboard: Space to toggle play
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && audio.src) {
        e.preventDefault();
        togglePlay();
      }
    });

    // ── Upload ──
    function setupUpload() {
      uploadZone.addEventListener('click', function () {
        fileInput.click();
      });

      fileInput.addEventListener('change', function (e) {
        if (e.target.files.length) handleFiles(e.target.files);
        fileInput.value = '';
      });

      uploadZone.addEventListener('dragover', function (e) {
        e.preventDefault();
        uploadZone.classList.add('dragover');
      });

      uploadZone.addEventListener('dragleave', function (e) {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
      });

      uploadZone.addEventListener('drop', function (e) {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
      });
    }

    async function handleFiles(files) {
      var audioFiles = Array.from(files).filter(function (f) { return f.type.startsWith('audio/'); });
      if (!audioFiles.length) return;

      for (var i = 0; i < audioFiles.length; i++) {
        var file = audioFiles[i];
        try {
          await EchoAPI.saveTrackRecord({
            blob: file,
            file: file,
            originalName: file.name,
            title: EchoAPI.sanitizeTitle(file.name)
          });
        } catch (err) {
          console.error('Upload failed for ' + file.name + ':', err);
        }
      }

      showUploadSuccess();
      await loadTracks();
    }

    function showUploadSuccess() {
      uploadSuccess.classList.add('visible');
      if (uploadSuccessTimer) clearTimeout(uploadSuccessTimer);
      uploadSuccessTimer = setTimeout(function () {
        uploadSuccess.classList.remove('visible');
      }, 3000);
    }

    // ── Delete ──
    async function deleteTrack(trackId) {
      try {
        await EchoAPI.deleteTrackRecord(trackId);
        if (currentTrack && currentTrack.id === trackId) {
          audio.pause();
          audio.src = '';
          currentTrack = null;
          isPlaying = false;
          nowTitle.textContent = 'Select a track';
          nowArtist.textContent = '';
          progressFill.style.width = '0%';
          currentTimeEl.textContent = '0:00';
          totalTimeEl.textContent = '0:00';
          playBtn.disabled = true;
          updatePlayBtn();
        }
        await loadTracks();
      } catch (err) {
        console.error('Delete failed:', err);
      }
    }

    // ── Helpers ──
    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '0:00';
      var mins = Math.floor(seconds / 60);
      var secs = Math.floor(seconds % 60);
      return mins + ':' + String(secs).padStart(2, '0');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Start ──
    init();
  </script>
</body>
</html>
