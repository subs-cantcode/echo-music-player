<!DOCTYPE html>
<html>
    <head>
        <title>Music Player</title>
        <h1 class="center">Ignite: Set the Spark 
            with your favourite Music</h1>

        <link rel="icon" type="image/jpg" href=""> <!--this is for favicon (image has to be added)-->

        <div>

            <form>

        </div>
