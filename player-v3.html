<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Player v3</title>
  <link rel="shortcut icon" href="images/echo-logo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-1: #fff4e8;
      --bg-2: #f8fbff;
      --blob-1: #ffd3b9;
      --blob-2: #c7e4ff;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-solid: #ffffff;
      --panel-line: rgba(255, 255, 255, 0.7);
      --sidebar-bg: rgba(255, 255, 255, 0.85);
      --surface: #ffffff;
      --btn-bg: #f4f4f8;
      --btn-bg-hover: #ededf4;
      --empty-bg: rgba(255, 255, 255, 0.75);
      --pill-bg: rgba(0, 0, 0, 0.04);
      --now-bg: linear-gradient(140deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.55));
      --now-border: rgba(255, 255, 255, 0.7);
      --now-inset: rgba(255, 255, 255, 0.9);
      --active-bg: linear-gradient(135deg, #1f1f27 0%, #343446 100%);
      --active-meta: rgba(255, 255, 255, 0.8);
      --range-rest: #dbdbe4;
      --text: #1b1b1f;
      --muted: #65657a;
      --accent: #ff5e2b;
      --accent-2: #ff925a;
      --ring: rgba(255, 94, 43, 0.35);
      --border: rgba(40, 40, 60, 0.14);
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-sm: 10px;
    }

    body[data-theme="dark"] {
      --bg-1: #12161f;
      --bg-2: #0e131c;
      --blob-1: #1a2333;
      --blob-2: #1a1f2a;
      --panel: rgba(19, 25, 36, 0.8);
      --panel-solid: #161c28;
      --panel-line: rgba(255, 255, 255, 0.08);
      --sidebar-bg: rgba(16, 21, 31, 0.82);
      --surface: #1a2231;
      --btn-bg: #243047;
      --btn-bg-hover: #2a3750;
      --empty-bg: rgba(26, 34, 49, 0.8);
      --pill-bg: rgba(255, 255, 255, 0.1);
      --now-bg: linear-gradient(150deg, #1a2230 0%, #1e2737 100%);
      --now-border: rgba(255, 255, 255, 0.1);
      --now-inset: rgba(255, 255, 255, 0.05);
      --active-bg: linear-gradient(135deg, #2b3548 0%, #364259 100%);
      --active-meta: rgba(229, 234, 245, 0.86);
      --range-rest: #3a455b;
      --text: #e5eaf5;
      --muted: #96a2bb;
      --accent: #9ba6ba;
      --accent-2: #77839a;
      --ring: rgba(155, 166, 186, 0.35);
      --border: rgba(226, 233, 247, 0.14);
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 5% 10%, var(--blob-1) 0%, transparent 30%),
        radial-gradient(circle at 90% 20%, var(--blob-2) 0%, transparent 32%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
      padding: 16px;
      overflow: hidden;
    }

    .app {
      width: min(1500px, 100%);
      max-width: 1500px;
      margin: 0 auto;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 32px);
      min-height: 560px;
    }

    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto minmax(140px, 1fr) auto;
      gap: 8px;
      min-height: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
      justify-content: space-between;
    }

    .brand-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .theme-toggle i {
      font-size: 0.84rem;
    }

    .theme-switch {
      position: relative;
      width: 40px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .theme-slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      transition: background 140ms ease;
    }

    .theme-slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #1f1f28;
      transition: transform 160ms ease;
    }

    .theme-switch input:checked + .theme-slider::before {
      transform: translateX(18px);
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
    }

    .brand h1 {
      font-size: 1.12rem;
      font-weight: 700;
    }

    .subtext {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .upload {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      text-align: center;
      background: var(--surface);
      transition: border-color 160ms, transform 160ms;
      cursor: pointer;
      user-select: none;
    }

    .upload:hover,
    .upload.dragover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .upload strong {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .upload small {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0;
    }

    .playlist-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .pill {
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--pill-bg);
      border-radius: 999px;
      padding: 5px 10px;
    }

    .playlist {
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
      flex: 1;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
    }

    .drag-scroll {
      cursor: grab;
    }

    .drag-scroll.dragging {
      cursor: grabbing;
      user-select: none;
    }

    .songs-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 8px;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 6px;
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-head h2 {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .scroll-buttons {
      display: flex;
      gap: 6px;
    }

    .scroll-btn {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 8px;
      padding: 0;
      font-size: 0.72rem;
      line-height: 1;
    }

    .playlist-tabs-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-height: 0;
    }

    .playlist-tabs {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
      padding-bottom: 2px;
    }

    .playlist-tabs::-webkit-scrollbar {
      height: 6px;
    }

    .playlist-tabs::-webkit-scrollbar-thumb {
      background: var(--muted);
      border-radius: 999px;
    }

    .playlist-tab {
      height: 28px;
      min-width: max-content;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 0 10px;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .playlist-tab.active {
      background: #1f1f28;
      color: #fff;
      border-color: transparent;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .account-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 8px;
      display: grid;
      gap: 6px;
      align-content: start;
      min-height: 0;
    }

    .logout-option {
      width: 100%;
      height: 36px;
      min-width: 0;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
    }

    .logout-option i {
      font-size: 0.95rem;
    }

    .delete-account-option {
      width: 100%;
      height: 36px;
      min-width: 0;
      margin-top: 6px;
      border-radius: 12px;
      background: rgba(217, 54, 62, 0.12);
      border: 1px solid rgba(217, 54, 62, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e67e84;
    }

    .delete-account-option:hover {
      background: rgba(217, 54, 62, 0.2);
    }

    .track-row {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--panel-solid);
      padding: 9px;
      transition: all 160ms;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .track-row:hover {
      border-color: var(--border);
      transform: translateX(2px);
    }

    .track-row.active {
      border-color: transparent;
      background: var(--active-bg);
      color: #fff;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
    }

    .track-main {
      cursor: pointer;
      min-width: 0;
    }

    .track-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.2;
      word-break: break-word;
    }

    .track-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .track-row.active .track-meta {
      color: var(--active-meta);
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .track-picker {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      height: 30px;
      padding: 0 8px;
      font: inherit;
      font-size: 0.72rem;
      max-width: 130px;
    }

    .track-row.active .track-picker {
      background: var(--surface);
      color: var(--text);
    }

    .add-btn {
      height: 30px;
      min-width: auto;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      background: var(--btn-bg);
    }

    .delete-btn {
      height: 30px;
      min-width: 30px;
      width: 30px;
      border-radius: 10px;
      padding: 0;
      font-size: 0.78rem;
      background: rgba(217, 54, 62, 0.12);
      color: #e67e84;
      border: 1px solid rgba(217, 54, 62, 0.25);
    }

    .delete-btn:hover {
      background: rgba(217, 54, 62, 0.2);
    }

    .main {
      padding: 12px;
      display: grid;
      grid-template-rows: minmax(106px, 22vh) minmax(88px, 16vh) minmax(150px, 1fr) auto;
      gap: 8px;
      overflow: hidden;
      min-height: 0;
    }

    .playlist-board {
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      padding: 10px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      overflow: hidden;
    }

    .board-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .board-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .board-top h2 {
      font-size: 0.92rem;
      font-weight: 600;
    }

    .create-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 420px;
    }

    .create-row input {
      flex: 1;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      font: inherit;
      background: var(--surface);
      color: var(--text);
    }

    .create-row button {
      height: 34px;
      border-radius: 12px;
      padding: 0 14px;
      min-width: auto;
      background: #1f1f28;
      color: #fff;
    }

    .playlist-grid-wrap {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
    }

    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      align-content: start;
    }

    .playlist-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      padding: 8px;
      text-align: left;
      cursor: pointer;
      transition: transform 140ms, border-color 140ms;
      height: auto;
      min-width: 0;
    }

    .playlist-card:hover {
      transform: translateY(-1px);
      border-color: rgba(31, 31, 40, 0.3);
    }

    .playlist-card.active {
      border-color: transparent;
      background: var(--active-bg);
      color: #fff;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
    }

    .playlist-name {
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .playlist-count {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .playlist-card.active .playlist-count {
      color: rgba(255, 255, 255, 0.78);
    }

    .playlist-preview {
      margin-top: 8px;
      font-size: 0.68rem;
      color: var(--muted);
      min-height: 1.1em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .playlist-card.active .playlist-preview {
      color: rgba(255, 255, 255, 0.75);
    }

    .favorites-panel {
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 8px;
      display: grid;
      gap: 6px;
      overflow: hidden;
    }

    .favorites-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .favorites-head h2 {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .favorites-list {
      display: grid;
      gap: 6px;
    }

    .favorite-item {
      width: 100%;
      height: auto;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }

    .favorite-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .favorite-item i {
      color: #ff5e2b;
      font-size: 0.95rem;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .favorite-toggle {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      padding: 0;
    }

    .favorite-toggle i {
      font-size: 0.94rem;
    }

    .favorite-toggle.active {
      color: #ff5e2b;
      border-color: rgba(255, 94, 43, 0.35);
      background: rgba(255, 94, 43, 0.08);
    }

    .rename-toggle {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--text);
    }

    .rename-toggle i {
      font-size: 0.9rem;
    }

    .now-playing {
      border-radius: var(--radius-xl);
      background: var(--now-bg);
      border: 1px solid var(--now-border);
      box-shadow: inset 0 1px 0 var(--now-inset);
      padding: 12px;
      display: grid;
      align-content: center;
      gap: 10px;
      min-height: 0;
    }

    .cover {
      width: clamp(110px, 18vw, 170px);
      aspect-ratio: 1;
      border-radius: 20px;
      background: linear-gradient(145deg, #23232e 0%, #3f3f54 58%, #55557a 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 52px;
      box-shadow: 0 24px 45px rgba(0, 0, 0, 0.2);
    }

    .cover i {
      font-size: 40px;
    }

    .track-details h3 {
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      line-height: 1.2;
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .track-details p {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .progress {
      margin-top: 4px;
      display: grid;
      gap: 8px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) var(--percent, 0%), var(--range-rest) var(--percent, 0%));
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .controls {
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .left-controls,
    .right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: transform 120ms, background 120ms, color 120ms;
      height: 42px;
      min-width: 42px;
      padding: 0 12px;
    }

    button:hover {
      transform: translateY(-1px);
      background: var(--btn-bg-hover);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-icon {
      width: 42px;
      height: 36px;
      padding: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .btn-primary {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 15px;
      box-shadow: 0 10px 22px rgba(255, 94, 43, 0.34);
    }

    .btn-primary i {
      font-size: 16px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ff7449, #ff9f6f);
    }

    .btn-toggled {
      background: #1f1f28;
      color: #fff;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 170px;
    }

    .volume-toggle {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 10px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
    }

    .volume-toggle:hover {
      background: var(--btn-bg);
      border-color: var(--border);
      color: var(--text);
    }

    .volume-toggle i {
      font-size: 0.96rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.7rem;
      text-align: right;
      margin-top: 4px;
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
      background: var(--empty-bg);
    }

    @media (max-width: 980px) {
      body { padding: 10px; overflow: hidden; }
      .app { grid-template-columns: 1fr; height: calc(100vh - 20px); }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .main { grid-template-rows: 132px 96px minmax(110px, 1fr) auto; }
      .cover { width: clamp(96px, 32vw, 140px); }
      .controls { justify-content: center; }
      .hint { text-align: center; }
    }

    @media (max-height: 900px) {
      .app {
        height: calc(100vh - 20px);
      }

      .sidebar {
        padding: 10px;
        gap: 6px;
      }

      .upload {
        padding: 9px;
      }

      .songs-panel {
        padding: 7px;
        gap: 5px;
      }

      .main {
        padding: 9px;
        gap: 6px;
        grid-template-rows: minmax(96px, 20vh) minmax(72px, 13vh) minmax(130px, 1fr) auto;
      }

      .playlist-board {
        padding: 8px;
      }

      .controls {
        padding: 5px 8px;
        gap: 6px;
      }

      .btn-icon {
        width: 38px;
        height: 34px;
      }

      .btn-primary {
        width: 40px;
        height: 40px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-main">
          <div class="brand-badge">E</div>
          <div>
            <h1>Echo Player</h1>
            <p class="subtext">Your Space, Your Echo.</p>
          </div>
        </div>
        <div class="theme-toggle" title="Theme">
          <i class="bi bi-sun" aria-hidden="true"></i>
          <label class="theme-switch" for="themeToggleInput">
            <input id="themeToggleInput" type="checkbox" aria-label="Toggle dark mode" />
            <span class="theme-slider"></span>
          </label>
          <i class="bi bi-moon-stars" aria-hidden="true"></i>
        </div>
      </div>

      <label class="upload" id="uploadZone" for="fileInput">
        <strong>Add songs</strong>
        <small>Click or drag files here</small>
      </label>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden />

      <div class="songs-panel">
        <div class="panel-head">
          <h2>Uploaded Songs</h2>
          <span id="trackCount" class="pill">0 tracks</span>
        </div>
        <div class="playlist-tabs-row">
          <button id="tabsScrollLeft" type="button" class="scroll-btn" title="Scroll playlist tabs left"><i class="bi bi-chevron-left"></i></button>
          <div id="playlistTabs" class="playlist-tabs"></div>
          <button id="tabsScrollRight" type="button" class="scroll-btn" title="Scroll playlist tabs right"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="scroll-buttons">
          <button id="songsScrollUp" type="button" class="scroll-btn" title="Scroll up"><i class="bi bi-chevron-up"></i></button>
          <button id="songsScrollDown" type="button" class="scroll-btn" title="Scroll down"><i class="bi bi-chevron-down"></i></button>
        </div>
        <div id="playlist" class="playlist">
          <div class="empty">No songs yet. Add local files to start playback.</div>
        </div>
      </div>

      <div class="account-panel">
        <div class="panel-head">
          <h2>Account</h2>
        </div>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="logout-option" type="button">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span>Log out</span>
          </button>
          <button id="deleteAccountBtn" class="delete-account-option" type="button">
            <i class="bi bi-person-x-fill" aria-hidden="true"></i>
            <span>Delete account</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="playlist-board">
        <div class="board-top">
          <div class="board-left">
            <h2>Playlist Cards</h2>
            <div class="scroll-buttons">
              <button id="cardsScrollUp" type="button" class="scroll-btn" title="Scroll up"><i class="bi bi-chevron-up"></i></button>
              <button id="cardsScrollDown" type="button" class="scroll-btn" title="Scroll down"><i class="bi bi-chevron-down"></i></button>
            </div>
          </div>
          <form id="createPlaylistForm" class="create-row">
            <input id="newPlaylistInput" type="text" placeholder="Create new playlist..." maxlength="40" />
            <button type="submit">Create</button>
          </form>
        </div>
        <div id="playlistGridWrap" class="playlist-grid-wrap">
          <div id="playlistGrid" class="playlist-grid"></div>
        </div>
      </section>

      <section class="favorites-panel">
        <div class="favorites-head">
          <h2>Favorites</h2>
          <span id="favoritesCount" class="pill">0 tracks</span>
        </div>
        <div id="favoritesList" class="favorites-list">
          <div class="empty">No favorite songs yet.</div>
        </div>
      </section>

      <section class="now-playing">
        <div class="cover"><i class="bi bi-music-note-beamed" aria-hidden="true"></i></div>

        <div class="track-details">
          <div class="title-row">
            <h3 id="currentTitle">Nothing is playing</h3>
            <div class="title-actions">
              <button id="renameTrackBtn" class="rename-toggle" title="Rename current track">
                <i class="bi bi-pencil-square" aria-hidden="true"></i>
              </button>
              <button id="favoriteToggleBtn" class="favorite-toggle" title="Add to favorites">
                <i class="bi bi-heart" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <p id="currentMeta">Upload songs to begin.</p>
        </div>

        <div class="progress">
          <input id="seekBar" type="range" min="0" max="100" value="0" />
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="duration">00:00</span>
          </div>
        </div>
      </section>

      <section>
        <div class="controls">
          <div class="left-controls">
            <button id="shuffleBtn" class="btn-icon" title="Shuffle"><i class="bi bi-shuffle" aria-hidden="true"></i></button>
            <button id="prevBtn" class="btn-icon" title="Previous"><i class="bi bi-skip-backward-fill" aria-hidden="true"></i></button>
            <button id="playPauseBtn" class="btn-primary" title="Play/Pause"><i class="bi bi-play-fill" aria-hidden="true"></i></button>
            <button id="nextBtn" class="btn-icon" title="Next"><i class="bi bi-skip-forward-fill" aria-hidden="true"></i></button>
            <button id="repeatBtn" class="btn-icon" title="Repeat"><i class="bi bi-repeat" aria-hidden="true"></i></button>
          </div>

          <div class="right-controls volume-wrap">
            <button id="muteToggleBtn" class="volume-toggle" type="button" title="Mute / Unmute">
              <i id="volumeIcon" class="bi bi-volume-up-fill" aria-hidden="true"></i>
            </button>
            <input id="volumeBar" type="range" min="0" max="100" value="80" />
          </div>

        <p class="hint">Shortcuts: <strong>Space</strong> play/pause, <strong>←/→</strong> seek, <strong>↑/↓</strong> volume.</p>
      </section>
    </main>
  </div>

  <audio id="audio"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/echo-api.js"></script>
  <script>
    const THEME_KEY = 'echo-theme-preference';
    const mediaDark = window.matchMedia('(prefers-color-scheme: dark)');
    const LOGIN_HREF = 'login-and-signup/login.html';
    let PREFS_STORAGE_KEY = 'echo-player-prefs-v1';

    const state = {
      tracks: [],
      playlists: [],
      favorites: [],
      activePlaylistId: 'all',
      currentTrackId: null,
      isShuffle: false,
      isRepeat: false,
      lastVolumeBeforeMute: 0.8,
      sessionUser: null,
      hydrating: true
    };

    const audio = document.getElementById('audio');
    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const logoutBtn = document.getElementById('logoutBtn');
    const deleteAccountBtn = document.getElementById('deleteAccountBtn');
    const songsScrollUpBtn = document.getElementById('songsScrollUp');
    const songsScrollDownBtn = document.getElementById('songsScrollDown');
    const tabsScrollLeftBtn = document.getElementById('tabsScrollLeft');
    const tabsScrollRightBtn = document.getElementById('tabsScrollRight');
    const playlistTabsEl = document.getElementById('playlistTabs');
    const playlistEl = document.getElementById('playlist');
    const playlistGridWrapEl = document.getElementById('playlistGridWrap');
    const cardsScrollUpBtn = document.getElementById('cardsScrollUp');
    const cardsScrollDownBtn = document.getElementById('cardsScrollDown');
    const playlistGridEl = document.getElementById('playlistGrid');
    const createPlaylistForm = document.getElementById('createPlaylistForm');
    const newPlaylistInput = document.getElementById('newPlaylistInput');
    const trackCountEl = document.getElementById('trackCount');
    const favoritesCountEl = document.getElementById('favoritesCount');
    const favoritesListEl = document.getElementById('favoritesList');
    const favoriteToggleBtn = document.getElementById('favoriteToggleBtn');
    const renameTrackBtn = document.getElementById('renameTrackBtn');
    const currentTitleEl = document.getElementById('currentTitle');
    const currentMetaEl = document.getElementById('currentMeta');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const seekBar = document.getElementById('seekBar');
    const volumeBar = document.getElementById('volumeBar');
    const muteToggleBtn = document.getElementById('muteToggleBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const themeToggleInput = document.getElementById('themeToggleInput');

    function resolveTheme(preference) {
      if (preference === 'dark' || preference === 'light') return preference;
      return mediaDark.matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      if (themeToggleInput) {
        themeToggleInput.checked = theme === 'dark';
      }
    }

    function initTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem(THEME_KEY);
      } catch {}
      applyTheme(resolveTheme(saved));
    }

    function setThemePreference(theme) {
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch {}
      applyTheme(theme);
    }

    function toggleMute() {
      if (audio.muted || audio.volume === 0) {
        const restoreVolume = Math.max(0.05, Number(state.lastVolumeBeforeMute) || 0.8);
        audio.muted = false;
        audio.volume = restoreVolume;
        volumeBar.value = String(Math.round(restoreVolume * 100));
      } else {
        state.lastVolumeBeforeMute = audio.volume;
        audio.muted = true;
      }
      setRangeFill(volumeBar, Number(volumeBar.value));
      updateVolumeIcon();
    }

    function redirectToLogin() {
      window.location.href = LOGIN_HREF;
    }

    async function getAllTrackRecords() {
      return EchoAPI.getAllTrackRecords();
    }

    async function saveTrackRecord(record) {
      return EchoAPI.saveTrackRecord(record);
    }

    async function deleteTrackRecord(trackId) {
      return EchoAPI.deleteTrackRecord(trackId);
    }

    async function renameTrackRecord(trackId, nextTitle) {
      return EchoAPI.renameTrackRecord(trackId, nextTitle);
    }

    function setPlayButtonIcon(isPlaying) {
      playPauseBtn.innerHTML = isPlaying
        ? '<i class="bi bi-pause-fill" aria-hidden="true"></i>'
        : '<i class="bi bi-play-fill" aria-hidden="true"></i>';
    }

    function setFavoriteButtonState(isActive) {
      favoriteToggleBtn.classList.toggle('active', isActive);
      favoriteToggleBtn.innerHTML = isActive
        ? '<i class="bi bi-heart-fill" aria-hidden="true"></i>'
        : '<i class="bi bi-heart" aria-hidden="true"></i>';
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateVolumeIcon() {
      const level = audio.muted ? 0 : audio.volume;
      let iconClass = 'bi-volume-up-fill';
      if (level <= 0) iconClass = 'bi-volume-mute-fill';
      else if (level < 0.5) iconClass = 'bi-volume-down-fill';
      volumeIcon.className = `bi ${iconClass}`;
    }

    function setRangeFill(input, value, min = 0, max = 100) {
      const percent = ((value - min) / (max - min)) * 100;
      input.style.setProperty('--percent', `${Math.max(0, Math.min(100, percent))}%`);
    }

    function sanitizeTitle(fileName) {
      return fileName.replace(/\.[^/.]+$/, '');
    }

    function bytesToLabel(bytes) {
      if (!bytes && bytes !== 0) return 'unknown size';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let unitIndex = 0;
      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }
      return `${value.toFixed(value >= 100 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
    }

    function scrollPanel(element, direction = 1, axis = 'y') {
      if (!element) return;
      const basis = axis === 'x' ? element.clientWidth : element.clientHeight;
      const step = Math.max(120, Math.floor(basis * 0.7));
      element.scrollBy({
        top: axis === 'y' ? direction * step : 0,
        left: axis === 'x' ? direction * step : 0,
        behavior: 'smooth'
      });
    }

    function enableDragToScroll(element, axis = 'y') {
      if (!element) return;
      let isDragging = false;
      let startPointer = 0;
      let startScroll = 0;

      element.classList.add('drag-scroll');

      element.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const targetTag = e.target?.tagName;
        if (targetTag === 'BUTTON' || targetTag === 'INPUT' || targetTag === 'SELECT' || targetTag === 'OPTION') return;
        isDragging = true;
        startPointer = axis === 'x' ? e.clientX : e.clientY;
        startScroll = axis === 'x' ? element.scrollLeft : element.scrollTop;
        element.classList.add('dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const currentPointer = axis === 'x' ? e.clientX : e.clientY;
        const delta = currentPointer - startPointer;
        if (axis === 'x') {
          element.scrollLeft = startScroll - delta;
        } else {
          element.scrollTop = startScroll - delta;
        }
      });

      window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        element.classList.remove('dragging');
      });

      element.addEventListener('mouseleave', () => {
        if (!isDragging) return;
        isDragging = false;
        element.classList.remove('dragging');
      });
    }

    function buildTrackSignature(name, size) {
      const normalizedName = sanitizeTitle(String(name || '')).trim().toLowerCase();
      return `${normalizedName}::${size || 0}`;
    }

    function getCurrentTrack() {
      return state.tracks.find((track) => track.id === state.currentTrackId) || null;
    }

    function getPlaylistById(playlistId) {
      return state.playlists.find((playlist) => playlist.id === playlistId) || null;
    }

    function getTrackById(trackId) {
      return state.tracks.find((track) => track.id === trackId) || null;
    }

    function isFavorite(trackId) {
      return state.favorites.includes(trackId);
    }

    function getTracksForPlaylist(playlistId) {
      if (playlistId === 'all') return state.tracks;
      const playlist = getPlaylistById(playlistId);
      if (!playlist) return [];
      return playlist.trackIds.map((trackId) => getTrackById(trackId)).filter(Boolean);
    }

    function getActiveTracks() {
      return getTracksForPlaylist(state.activePlaylistId);
    }

    function persistMeta() {
      const payload = {
        activePlaylistId: state.activePlaylistId,
        currentTrackId: state.currentTrackId,
        isShuffle: state.isShuffle,
        isRepeat: state.isRepeat
      };
      try {
        localStorage.setItem(PREFS_STORAGE_KEY, JSON.stringify(payload));
      } catch {}
    }

    function restoreMeta() {
      let raw = null;
      try {
        raw = localStorage.getItem(PREFS_STORAGE_KEY);
      } catch {}
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        state.activePlaylistId = parsed.activePlaylistId ? String(parsed.activePlaylistId) : 'all';
        state.currentTrackId = parsed.currentTrackId ? String(parsed.currentTrackId) : null;
        state.isShuffle = Boolean(parsed.isShuffle);
        state.isRepeat = Boolean(parsed.isRepeat);
      } catch {}
    }

    function cleanupStateReferences() {
      const validIds = new Set(state.tracks.map((track) => track.id));
      state.favorites = state.favorites.filter((id) => validIds.has(id));
      state.playlists = state.playlists.map((playlist) => ({
        ...playlist,
        trackIds: playlist.trackIds.filter((id) => validIds.has(id))
      }));

      if (state.currentTrackId && !validIds.has(state.currentTrackId)) {
        state.currentTrackId = null;
      }

      if (state.activePlaylistId !== 'all' && !getPlaylistById(state.activePlaylistId)) {
        state.activePlaylistId = 'all';
      }
    }

    function updateTrackCount() {
      const visible = getActiveTracks().length;
      const total = state.tracks.length;
      if (state.activePlaylistId === 'all') {
        trackCountEl.textContent = `${total} ${total === 1 ? 'track' : 'tracks'}`;
        return;
      }
      trackCountEl.textContent = `${visible}/${total} tracks`;
    }

    function setActivePlaylist(playlistId) {
      const nextId = String(playlistId || 'all');
      if (nextId !== 'all' && !getPlaylistById(nextId)) return;
      state.activePlaylistId = nextId;
      renderPlaylistTabs();
      renderPlaylistCards();
      renderTrackList();
      persistMeta();
    }

    function renderPlaylistTabs() {
      playlistTabsEl.innerHTML = '';

      const tabs = [
        { id: 'all', name: 'All Songs', count: state.tracks.length },
        ...state.playlists.map((playlist) => ({
          id: playlist.id,
          name: playlist.name,
          count: playlist.trackIds.length
        }))
      ];

      tabs.forEach((tabData) => {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'playlist-tab';
        if (state.activePlaylistId === tabData.id) tab.classList.add('active');
        tab.textContent = `${tabData.name} (${tabData.count})`;
        tab.addEventListener('click', () => setActivePlaylist(tabData.id));
        playlistTabsEl.appendChild(tab);
      });
    }

    function updatePlayerInfo() {
      const track = getCurrentTrack();
      if (!track) {
        currentTitleEl.textContent = 'Nothing is playing';
        currentMetaEl.textContent = 'Upload songs to begin.';
        currentTimeEl.textContent = '00:00';
        durationEl.textContent = '00:00';
        seekBar.value = 0;
        setRangeFill(seekBar, 0);
        setPlayButtonIcon(false);
        favoriteToggleBtn.disabled = true;
        renameTrackBtn.disabled = true;
        setFavoriteButtonState(false);
        return;
      }

      currentTitleEl.textContent = track.title;
      currentMetaEl.textContent = `${track.type || 'audio'} • ${track.sizeLabel}`;
      durationEl.textContent = formatTime(audio.duration || 0);
      favoriteToggleBtn.disabled = false;
      renameTrackBtn.disabled = false;
      setFavoriteButtonState(isFavorite(track.id));
    }

    function renderPlaylistCards() {
      playlistGridEl.innerHTML = '';

      const allCard = document.createElement('button');
      allCard.type = 'button';
      allCard.className = 'playlist-card';
      if (state.activePlaylistId === 'all') allCard.classList.add('active');
      allCard.innerHTML = `
        <div class="playlist-name">All Songs</div>
        <div class="playlist-count">${state.tracks.length} ${state.tracks.length === 1 ? 'track' : 'tracks'}</div>
        <div class="playlist-preview">Every uploaded track</div>
      `;
      allCard.addEventListener('click', () => setActivePlaylist('all'));
      playlistGridEl.appendChild(allCard);

      state.playlists.forEach((playlist) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'playlist-card';
        if (state.activePlaylistId === playlist.id) card.classList.add('active');

        const preview =
          playlist.trackIds
            .slice(0, 2)
            .map((trackId) => getTrackById(trackId)?.title)
            .filter(Boolean)
            .join(' • ') || 'No tracks yet';

        card.innerHTML = `
          <div class="playlist-name">${playlist.name}</div>
          <div class="playlist-count">${playlist.trackIds.length} ${playlist.trackIds.length === 1 ? 'track' : 'tracks'}</div>
          <div class="playlist-preview">${preview}</div>
        `;

        card.addEventListener('click', () => setActivePlaylist(playlist.id));

        playlistGridEl.appendChild(card);
      });
    }

    function renderFavoritesList() {
      const favorites = state.favorites
        .map((trackId) => getTrackById(trackId))
        .filter(Boolean);

      favoritesCountEl.textContent = `${favorites.length} ${favorites.length === 1 ? 'track' : 'tracks'}`;
      favoritesListEl.innerHTML = '';

      if (!favorites.length) {
        favoritesListEl.innerHTML = '<div class="empty">No favorite songs yet.</div>';
        return;
      }

      favorites.forEach((track) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'favorite-item';
        item.innerHTML = `<span>${track.title}</span><i class="bi bi-heart-fill" aria-hidden="true"></i>`;
        item.addEventListener('click', () => {
          loadTrackById(track.id, true);
        });
        favoritesListEl.appendChild(item);
      });
    }

    function renderTrackList() {
      playlistEl.innerHTML = '';
      const visibleTracks = getActiveTracks();

      if (!state.tracks.length) {
        playlistEl.innerHTML = '<div class="empty">No songs yet. Add local files to start playback.</div>';
        updateTrackCount();
        updatePlayerInfo();
        return;
      }

      if (!visibleTracks.length) {
        playlistEl.innerHTML = '<div class="empty">This playlist is empty. Add tracks from your library rows.</div>';
        updateTrackCount();
        updatePlayerInfo();
        return;
      }

      visibleTracks.forEach((track) => {
        const row = document.createElement('div');
        row.className = 'track-row';
        if (track.id === state.currentTrackId) row.classList.add('active');

        const main = document.createElement('div');
        main.className = 'track-main';
        main.innerHTML = `
          <div class="track-title">${track.title}</div>
          <div class="track-meta">${track.type || 'audio'} • ${track.sizeLabel}</div>
        `;
        main.addEventListener('click', () => {
          loadTrackById(track.id, true);
        });

        const actions = document.createElement('div');
        actions.className = 'track-actions';

        const picker = document.createElement('select');
        picker.className = 'track-picker';
        picker.title = 'Select playlist';
        picker.innerHTML = '<option value="">Add to...</option>';
        state.playlists.forEach((playlist) => {
          const option = document.createElement('option');
          option.value = playlist.id;
          option.textContent = playlist.name;
          picker.appendChild(option);
        });

        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'add-btn';
        addBtn.textContent = 'Add';
        addBtn.addEventListener('click', () => {
          if (!picker.value) return;
          addTrackToPlaylist(track.id, picker.value);
          picker.value = '';
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = 'Delete track';
        deleteBtn.innerHTML = '<i class="bi bi-trash" aria-hidden="true"></i>';
        deleteBtn.addEventListener('click', () => {
          deleteTrack(track.id);
        });

        actions.appendChild(picker);
        actions.appendChild(addBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(main);
        row.appendChild(actions);
        playlistEl.appendChild(row);
      });

      updateTrackCount();
    }

    async function createPlaylist(name) {
      const clean = name.trim();
      if (!clean) return;
      if (state.playlists.some((playlist) => playlist.name.toLowerCase() === clean.toLowerCase())) return;

      try {
        const created = await EchoAPI.createPlaylist(clean);
        state.playlists.push(created);
      } catch {
        alert('Could not create playlist right now.');
        return;
      }
      renderPlaylistTabs();
      renderPlaylistCards();
      renderTrackList();
      persistMeta();
    }

    async function addTrackToPlaylist(trackId, playlistId) {
      const playlist = getPlaylistById(playlistId);
      if (!playlist) return;
      if (playlist.trackIds.includes(trackId)) return;

      try {
        await EchoAPI.addTrackToPlaylist(trackId, playlistId);
      } catch {
        alert('Could not add that track to the playlist.');
        return;
      }
      playlist.trackIds.push(trackId);
      renderPlaylistTabs();
      renderPlaylistCards();
      if (state.activePlaylistId === playlistId) renderTrackList();
      persistMeta();
    }

    async function toggleCurrentFavorite() {
      const track = getCurrentTrack();
      if (!track) return;

      const nextFavorite = !isFavorite(track.id);
      try {
        await EchoAPI.setTrackFavorite(track.id, nextFavorite);
      } catch {
        alert('Could not update favorite right now.');
        return;
      }

      if (nextFavorite) {
        state.favorites.push(track.id);
      } else {
        state.favorites = state.favorites.filter((id) => id !== track.id);
      }

      setFavoriteButtonState(isFavorite(track.id));
      renderFavoritesList();
      persistMeta();
    }

    async function renameCurrentTrack() {
      const track = getCurrentTrack();
      if (!track) return;

      const next = window.prompt('Rename track:', track.title);
      if (next === null) return;
      const cleaned = next.trim().slice(0, 120);
      if (!cleaned || cleaned === track.title) return;

      try {
        await renameTrackRecord(track.id, cleaned);
      } catch {
        alert('Could not rename track right now.');
        return;
      }

      track.title = cleaned;
      renderTrackList();
      renderPlaylistTabs();
      renderPlaylistCards();
      renderFavoritesList();
      updatePlayerInfo();
      persistMeta();
    }

    async function deleteTrack(trackId) {
      const track = getTrackById(trackId);
      if (!track) return;

      const currentWasDeleted = state.currentTrackId === trackId;

      try {
        await deleteTrackRecord(trackId);
      } catch {
        alert('Could not delete track right now.');
        return;
      }

      state.tracks = state.tracks.filter((item) => item.id !== trackId);
      state.favorites = state.favorites.filter((id) => id !== trackId);
      state.playlists = state.playlists.map((playlist) => ({
        ...playlist,
        trackIds: playlist.trackIds.filter((id) => id !== trackId)
      }));

      if (currentWasDeleted) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        state.currentTrackId = null;
      }

      cleanupStateReferences();
      renderPlaylistTabs();
      renderPlaylistCards();
      renderTrackList();
      renderFavoritesList();
      updatePlayerInfo();
      persistMeta();
    }

    async function addFiles(files) {
      const incoming = Array.from(files).filter((file) => file.type.startsWith('audio/'));
      if (!incoming.length) return;

      const shouldAutoplay = state.currentTrackId === null;
      const existingSignatures = new Set(state.tracks.map((track) => track.signature).filter(Boolean));

      for (const file of incoming) {
        const signature = buildTrackSignature(file.name, file.size);
        if (existingSignatures.has(signature)) {
          const shouldAddDuplicate = window.confirm('The track has already been uploaded. Add anyway?\n\nPress OK for Yes, or Cancel.');
          if (!shouldAddDuplicate) continue;
        }

        const title = sanitizeTitle(file.name);
        const type = file.type.split('/')[1]?.toUpperCase() || 'AUDIO';
        const sizeLabel = bytesToLabel(file.size);
        existingSignatures.add(signature);

        let saved;
        try {
          saved = await saveTrackRecord({
            title,
            originalName: file.name,
            type,
            sizeLabel,
            signature,
            blob: file
          });
        } catch (err) {
          alert(err.message || 'Could not upload that track.');
          existingSignatures.delete(signature);
          continue;
        }

        state.tracks.push({
          id: saved.id,
          title: saved.title || title,
          src: saved.src,
          type: saved.type || type,
          sizeLabel: saved.sizeLabel || sizeLabel,
          signature: saved.signature || signature
        });
      }

      renderPlaylistCards();
      renderPlaylistTabs();
      renderTrackList();
      renderFavoritesList();
      persistMeta();

      if (shouldAutoplay && state.tracks.length) {
        loadTrackById(state.tracks[0].id, true);
      }
    }

    function loadTrackById(trackId, autoplay = false) {
      const track = getTrackById(trackId);
      if (!track) return;

      state.currentTrackId = track.id;
      audio.src = track.src;
      audio.load();
      renderTrackList();
      updatePlayerInfo();
      persistMeta();

      if (autoplay) {
        audio.play().catch(() => {
          setPlayButtonIcon(false);
        });
      }
    }

    function togglePlayPause() {
      if (!state.tracks.length) return;
      if (state.currentTrackId === null) {
        const first = getActiveTracks()[0] || state.tracks[0];
        if (first) loadTrackById(first.id, true);
        return;
      }
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function getNextTrack() {
      const source = getActiveTracks();
      if (!source.length) return null;
      const currentIndex = source.findIndex((track) => track.id === state.currentTrackId);

      if (currentIndex === -1) return source[0];
      if (state.isShuffle && source.length > 1) {
        let index = currentIndex;
        while (index === currentIndex) {
          index = Math.floor(Math.random() * source.length);
        }
        return source[index];
      }
      return source[(currentIndex + 1) % source.length];
    }

    function getPrevTrack() {
      const source = getActiveTracks();
      if (!source.length) return null;
      const currentIndex = source.findIndex((track) => track.id === state.currentTrackId);

      if (currentIndex === -1) return source[0];
      if (state.isShuffle && source.length > 1) {
        let index = currentIndex;
        while (index === currentIndex) {
          index = Math.floor(Math.random() * source.length);
        }
        return source[index];
      }
      return source[(currentIndex - 1 + source.length) % source.length];
    }

    function playNext() {
      const track = getNextTrack();
      if (track) loadTrackById(track.id, true);
    }

    function playPrev() {
      const track = getPrevTrack();
      if (track) loadTrackById(track.id, true);
    }

    async function hydrateTracksFromStorage() {
      let records = [];
      try {
        records = await getAllTrackRecords();
      } catch {
        return;
      }
      records.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      records.forEach((record) => {
        if (!record?.id || !record?.src) return;
        state.tracks.push({
          id: String(record.id),
          title: record.title || 'Untitled',
          src: record.src,
          type: record.type || 'AUDIO',
          sizeLabel: record.sizeLabel || bytesToLabel(record.file_size_bytes),
          signature: record.signature || buildTrackSignature(record.title, record.file_size_bytes)
        });
        if (record.is_favorite) {
          state.favorites.push(String(record.id));
        }
      });
    }

    fileInput.addEventListener('change', async (e) => {
      await addFiles(e.target.files);
      fileInput.value = '';
    });

    createPlaylistForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      await createPlaylist(newPlaylistInput.value);
      newPlaylistInput.value = '';
    });

    favoriteToggleBtn.addEventListener('click', toggleCurrentFavorite);
    renameTrackBtn.addEventListener('click', renameCurrentTrack);
    songsScrollUpBtn.addEventListener('click', () => scrollPanel(playlistEl, -1));
    songsScrollDownBtn.addEventListener('click', () => scrollPanel(playlistEl, 1));
    tabsScrollLeftBtn.addEventListener('click', () => scrollPanel(playlistTabsEl, -1, 'x'));
    tabsScrollRightBtn.addEventListener('click', () => scrollPanel(playlistTabsEl, 1, 'x'));
    cardsScrollUpBtn.addEventListener('click', () => scrollPanel(playlistGridWrapEl, -1));
    cardsScrollDownBtn.addEventListener('click', () => scrollPanel(playlistGridWrapEl, 1));
    enableDragToScroll(playlistEl, 'y');
    enableDragToScroll(playlistGridWrapEl, 'y');
    enableDragToScroll(playlistTabsEl, 'x');
    logoutBtn.addEventListener('click', async () => {
      const shouldLogout = window.confirm('Log out now?');
      if (!shouldLogout) return;
      audio.pause();
      try {
        await EchoAPI.signOut();
      } catch {}
      redirectToLogin();
    });
    deleteAccountBtn.addEventListener('click', async () => {
      const reallyDelete = window.confirm('Do you really want to delete your account? This action cannot be undone.');
      if (!reallyDelete) return;

      const enteredPassword = window.prompt('Please enter your password to confirm account deletion:');
      if (enteredPassword === null) return;

      const email = state.sessionUser?.email;
      if (!email) {
        alert('Account record not found.');
        return;
      }

      try {
        await EchoAPI.signIn({ email, password: enteredPassword });
      } catch {
        alert('Incorrect password. Account was not deleted.');
        return;
      }

      audio.pause();
      try {
        await EchoAPI.deleteAccountData();
      } catch {
        alert('Could not delete account data right now.');
        return;
      }
      redirectToLogin();
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      uploadZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      uploadZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
      });
    });

    uploadZone.addEventListener('drop', async (e) => {
      const dt = e.dataTransfer;
      if (dt?.files?.length) await addFiles(dt.files);
    });

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);

    shuffleBtn.addEventListener('click', () => {
      state.isShuffle = !state.isShuffle;
      shuffleBtn.classList.toggle('btn-toggled', state.isShuffle);
      persistMeta();
    });

    repeatBtn.addEventListener('click', () => {
      state.isRepeat = !state.isRepeat;
      repeatBtn.classList.toggle('btn-toggled', state.isRepeat);
      persistMeta();
    });

    themeToggleInput.addEventListener('change', () => {
      const nextTheme = themeToggleInput.checked ? 'dark' : 'light';
      setThemePreference(nextTheme);
    });

    seekBar.addEventListener('input', () => {
      if (!audio.duration) return;
      const nextTime = (Number(seekBar.value) / 100) * audio.duration;
      audio.currentTime = nextTime;
      setRangeFill(seekBar, Number(seekBar.value));
    });

    volumeBar.addEventListener('input', () => {
      const volume = Number(volumeBar.value) / 100;
      audio.volume = volume;
      if (volume <= 0) {
        audio.muted = true;
      } else {
        audio.muted = false;
        state.lastVolumeBeforeMute = volume;
      }
      setRangeFill(volumeBar, Number(volumeBar.value));
      updateVolumeIcon();
    });
    muteToggleBtn.addEventListener('click', toggleMute);

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
      updatePlayerInfo();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const current = audio.currentTime;
      const percent = (current / audio.duration) * 100;
      seekBar.value = String(percent);
      setRangeFill(seekBar, percent);
      currentTimeEl.textContent = formatTime(current);
    });

    audio.addEventListener('play', () => {
      setPlayButtonIcon(true);
      renderTrackList();
    });

    audio.addEventListener('pause', () => {
      setPlayButtonIcon(false);
    });

    audio.addEventListener('ended', () => {
      if (state.isRepeat) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        return;
      }
      playNext();
    });

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      const editable = document.activeElement?.isContentEditable;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || editable) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      }

      if (e.key === 'ArrowRight') {
        if (!audio.duration) return;
        audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
      }

      if (e.key === 'ArrowLeft') {
        if (!audio.duration) return;
        audio.currentTime = Math.max(audio.currentTime - 5, 0);
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        audio.volume = Math.min(audio.volume + 0.05, 1);
        audio.muted = false;
        state.lastVolumeBeforeMute = audio.volume;
        volumeBar.value = String(Math.round(audio.volume * 100));
        setRangeFill(volumeBar, Number(volumeBar.value));
        updateVolumeIcon();
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        audio.volume = Math.max(audio.volume - 0.05, 0);
        if (audio.volume <= 0) {
          audio.muted = true;
        } else {
          audio.muted = false;
          state.lastVolumeBeforeMute = audio.volume;
        }
        volumeBar.value = String(Math.round(audio.volume * 100));
        setRangeFill(volumeBar, Number(volumeBar.value));
        updateVolumeIcon();
      }
    });

    mediaDark.addEventListener('change', () => {
      let saved = null;
      try {
        saved = localStorage.getItem(THEME_KEY);
      } catch {}
      if (!saved) {
        applyTheme(resolveTheme(null));
      }
    });

    async function initApp() {
      if (!EchoAPI.configLooksReady()) {
        alert('Supabase is not configured. Add your project URL and anon key to js/env.js.');
        redirectToLogin();
        return;
      }

      const session = await EchoAPI.getSession();
      if (!session?.user) {
        redirectToLogin();
        return;
      }

      state.sessionUser = session.user;
      PREFS_STORAGE_KEY = `echo-player-prefs-v1:${session.user.id}`;
      await EchoAPI.ensureProfile(session.user);

      EchoAPI.getClient().auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') {
          redirectToLogin();
        }
      });

      initTheme();
      restoreMeta();
      try {
        await hydrateTracksFromStorage();
        state.playlists = await EchoAPI.listPlaylists();
      } catch (err) {
        console.error(err);
        alert('Could not load your library. Check your connection and try again.');
      }
      cleanupStateReferences();

      audio.volume = 0.8;
      audio.muted = false;
      setRangeFill(volumeBar, 80);
      setRangeFill(seekBar, 0);
      updateVolumeIcon();
      setPlayButtonIcon(false);
      shuffleBtn.classList.toggle('btn-toggled', state.isShuffle);
      repeatBtn.classList.toggle('btn-toggled', state.isRepeat);

      renderPlaylistTabs();
      renderPlaylistCards();
      renderTrackList();
      renderFavoritesList();
      updatePlayerInfo();

      if (state.currentTrackId) {
        const track = getTrackById(state.currentTrackId);
        if (track) loadTrackById(track.id, false);
      }

      state.hydrating = false;
      persistMeta();
    }

    initApp().catch((err) => {
      console.error(err);
      state.hydrating = false;
      if (!state.sessionUser) {
        redirectToLogin();
        return;
      }
      renderPlaylistTabs();
      renderPlaylistCards();
      renderTrackList();
      renderFavoritesList();
      updatePlayerInfo();
    });
  </script>
</body>
</html>
