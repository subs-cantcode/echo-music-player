<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - Your Local Music Player</title>
    <link rel="shortcut icon" href="images/echo-logo.png" type="image/png">

    <!-- THIS IS THE BOOTSTRAP CODE LINK -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- THIS IS THE JSS CODE STRUCTURE -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Aldrich&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Outfit:wght@100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Outfit:wght@100..900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fafafa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            background: #ffffff;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            width: 150px; /* Increased from 80px to fit the text */
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            border-right: 1px solid #ececec;
            text-align: center; /* Keeps all text centered */
        }

        .sidebar-header {
            padding: 25px 0;
            text-align: center;
            border-bottom: 1px solid #ececec;
        }

        .sidebar-header h4 {
            margin: 0;
            font-weight: 600;
            font-size: 32px;
            color: #1a1a1a;
        }

        .sidebar-header .logo-emoji {
            font-size: 32px;
        }

        .nav-menu {
            flex: 1;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            padding: 20px 0;
            color: #999999;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .nav-item:hover {
            color: #1a1a1a;
        }

        .nav-item.active {
            color: #1a1a1a;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 0 4px 4px 0;
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item .nav-emoji {
            font-size: 24px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Logout Section */
        .logout-section {
            padding: 20px 0;
            border-top: 1px solid #ececec;
            text-align: center;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: #999999;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 15px 0;
        }

        .logout-btn:hover {
            color: #ff4444;
            background: #fff5f5;
        }

        .logout-btn i {
            font-size: 24px;
        }

        .logout-btn .nav-emoji {
            font-size: 24px;
        }

        .logout-btn span {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        .main-content {
            margin-left: 80px;
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-bottom: 100px;
        }

        .main-content::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .main-content {
            scrollbar-width: none;
        }

        .section {
            min-height: 100vh;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 900px;
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed #e0e0e0;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            background: #fafafa;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #1a1a1a;
            background: #f5f5f5;
            transform: scale(1.01);
        }

        .upload-zone i {
            font-size: 64px;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .upload-zone .upload-emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-zone h3 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-zone p {
            color: #999999;
            margin: 0;
        }

        /* Song List */
        .song-item {
            background: #f7fafc;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .song-item:hover {
            background: #edf2f7;
            border-color: #e2e8f0;
            transform: translateX(5px);
            
        }

        .song-item.playing {
            background: #000000;
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .song-icon {
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .song-icon .song-emoji {
            font-size: 20px;
        }

        .song-item.playing .song-icon {
            background: #000000;
            color: #ffffff;
            filter: brightness(100%) !important
        }

        .song-details h6 {
            margin: 0;
            font-weight: 600;
            font-size: 15px;
            color: #2d3748;
        }

        .song-details p {
            margin: 0;
            font-size: 13px;
            color: #718096;
        }

        .song-item.playing .song-details h6 {
            color: white;
        }

        .song-item.playing .song-details p {
            color: rgba(255, 255, 255, 0.8);
        }

        .song-actions button {
            background: transparent;
            border: none;
            color: #a0aec0;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px;
        }

        .song-actions button:hover {
            color: #ffffff;
            transform: scale(1.2);
        }

        .song-item.playing .song-actions button {
            color: white;
        }

        .song-item.playing .song-actions button:hover {
            color: #fff;
            opacity: 0.8;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
        }

        .empty-state i {
            font-size: 64px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .empty-state .empty-emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* Playlist Grid */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Playlist box */
        .playlist-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(26, 26, 26, 0.15);

            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .playlist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(26, 26, 26, 0.3);
        }

        .playlist-card i {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .playlist-card .playlist-emoji {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .playlist-card h5 {
            margin: 0;
            font-weight: 600;
        }

        .create-playlist {
            background: #fafafa;
            border: 2px dashed #e0e0e0;
            color: #999999;
        }

        .create-playlist:hover {
            border-color: #1a1a1a;
            color: #1a1a1a;
            background: #f5f5f5;
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 150px;
            width: calc(100% - 150px);
            z-index: 999;
            background: white;
            padding: 20px 40px;
            border-top: 1px solid #ececec;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.03);
            z-index: 999;
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .current-track {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 0;
        }

        .track-thumbnail {
            width: 50px;
            height: 50px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
        }

        .track-thumbnail .player-emoji {
            font-size: 24px;
        }

        .track-info {
            min-width: 0;
        }

        .track-info h6 {
            margin: 0;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #1a1a1a;
        }

        .track-info p {
            margin: 0;
            font-size: 12px;
            color: #999999;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 2;
            gap: 15px;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
        }

        .control-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    }

        .control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(26, 26, 26, 0.25);
            background: #ffffff;
            border: 1px solid #000000;
        }

        .control-btn.play-pause {
            width: 55px;
            height: 55px;
            font-size: 20px;
        }

        .control-btn .control-emoji {
            font-size: 18px;
        }

        .control-btn.play-pause .control-emoji {
            font-size: 22px;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time {
            font-size: 12px;
            color: #999999;
            min-width: 40px;
        }

        .progress-bar-custom {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-custom .progress {
            height: 100%;
            background: #1a1a1a;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: flex-end;
        }

        .volume-control i {
            color: #a58a8a;
        }

        .volume-control .volume-emoji {
            font-size: 18px;
        }

        .volume-slider {
            width: 100px;
        }

        /* font */
        .logo-description {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            color: #929292;
            margin-top: 5px;
            line-height: 1.2;
        }
        
        .sidebar-title {
            font-family: 'Aldrich', sans-serif;
            font-weight: bold;
        }

        .section-title {
            font-family: 'Aldrich', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        /* This ensures all your SVGs resize properly and match text color */
        svg {
            width: 24px;
            height: 24px;
            fill: currentColor; /* The SVG will now change color when the text color changes! */
            display: inline-block;
            vertical-align: middle;
        }

        /* Example: When you hover over a nav-item, the SVG changes color automatically */
        .nav-item:hover {
            color: #000000; /* The SVG 'fill' will now also become black */
        }
        .nav-item svg {
            margin-bottom: 8px; /* Adds space between the house and the word "Home" */
            }

        .scroll-dragger {
            position: fixed;
            right: 14px;
            top: 16px;
            bottom: 110px;
            width: 32px;
            background: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 8px 6px;
            z-index: 1001;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .scroll-dragger.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .scroll-btn {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 999px;
            background: #f5f5f5;
            color: #505050;
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            font-size: 10px;
        }

        .scroll-btn:hover {
            background: #ededed;
        }

        .scroll-rail {
            position: relative;
            flex: 1;
            width: 8px;
            background: #efefef;
            border-radius: 999px;
            cursor: pointer;
        }

        .scroll-thumb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            border-radius: 999px;
            background: #1a1a1a;
            cursor: grab;
        }

        .scroll-thumb.dragging {
            cursor: grabbing;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4 class="sidebar-title">E C H O</h4>
            <p class="logo-description">Your Space.<br>Your Echo.</p>
        </div>
        
        <div class="nav-menu">
            <div class="nav-item active" onclick="scrollToSection('home')">
                   <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-fill" viewBox="0 0 16 16">
                        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                        <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
                    </svg>
                <span>Home</span>

            </div>
            <div class="nav-item" onclick="scrollToSection('upload')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-upload" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                    <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
                </svg>
                <span>Upload</span>
            </div>

            <div class="nav-item" onclick="scrollToSection('playlists')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-music-note-list" viewBox="0 0 16 16">
                    <path d="M12 13c0 1.105-1.12 2-2.5 2S7 14.105 7 13s1.12-2 2.5-2 2.5.895 2.5 2"/>
                    <path fill-rule="evenodd" d="M12 3v10h-1V3z"/>
                    <path d="M11 2.82a1 1 0 0 1 .804-.98l3-.6A1 1 0 0 1 16 2.22V4l-5 1z"/>
                    <path fill-rule="evenodd" d="M0 11.5a.5.5 0 0 1 .5-.5H4a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5m0-4A.5.5 0 0 1 .5 7H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5m0-4A.5.5 0 0 1 .5 3H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5"/>
                </svg>
                <span>Lists</span>
            </div>
        </div>

        <div class="logout-section">
            <button class="logout-btn" onclick="logout()">
                <span class="nav-emoji"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-left" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"/>
                        <path fill-rule="evenodd" d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"/>
                    </svg>
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        
        <!-- HOME SECTION -->
        <section class="section" id="home">
            <div class="content-box">
                <h2 class="section-title">Your Music</h2>
                <div id="songList">
                    <div class="empty-state">
                        <img src="images/svg icons/music.svg" alt="">
                        <h5>No songs yet</h5>
                        <p>Upload your music to get started</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- UPLOAD SECTION -->
        <section class="section" id="upload">
            <div class="content-box">
                <h2 class="section-title">Upload Music</h2>
                <div class="upload-zone" id="uploadZone">
                    <img src="images/svg icons/upload-box-1.svg" width="48" height="48">
                    <h3>Drag and Drop Your Music Here</h3>
                    <p>or click to browse files</p>
                    <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
                </div>
            </div>
        </section>

        <!-- PLAYLISTS SECTION -->
        <section class="section" id="playlists">
            <div class="content-box">
                <h2 class="section-title">Your Playlists</h2>
                <div class="playlist-grid">
                    <div class="playlist-card create-playlist" onclick="createPlaylist()">
                        <img src="images/svg icons/create.svg" alt="Create Playlist" width="32" height="32">
                        <h5>Create Playlist</h5>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <div class="scroll-dragger" id="scrollDragger" aria-label="Page scroll controls">
        <button type="button" class="scroll-btn" id="scrollUpBtn" title="Scroll up">
            <i class="bi bi-chevron-up"></i>
        </button>
        <div class="scroll-rail" id="scrollRail">
            <div class="scroll-thumb" id="scrollThumb"></div>
        </div>
        <button type="button" class="scroll-btn" id="scrollDownBtn" title="Scroll down">
            <i class="bi bi-chevron-down"></i>
        </button>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="player-row">
            <!-- Current Track -->
            <div class="current-track">
                <div class="track-thumbnail">
                    <img src="images/svg icons/music.svg" width="48" height="48">
                </div>
                <div class="track-info">
                    <h6 id="currentSongName">No song playing</h6>
                    <p id="currentSongArtist">---</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="player-controls">
                <div class="control-buttons">

                    <input type="range" id="progressBar" value="0" min="0" max="100" class="progress-bar">

                    <button class="control-btn" width="48" height="48" onclick="previousSong()"> <!--this is for previous icon-->
                        <i class="bi bi-skip-start-fill fs-5"></i></button>
                    <button class="control-btn play-pause" id="playPauseBtn" width="48" height="48" onclick="togglePlayPause()"> <!--this is for play/pause icon-->
                        <i class="bi bi-play-fill fs-4"></i>
                    </button>
                    <button class="control-btn" width="48" height="48" onclick="nextSong()"> <!--this is for next song icon-->
                        <i class="bi bi-skip-end-fill fs-5"></i>
                    </button>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar-custom" id="progressBar">
                        <div class="progress" id="progressFill"></div>
                    </div>
                    <span class="time" id="totalTime">0:00</span>
                </div>
            </div>

            <!-- Volume -->
            <div class="volume-control">
                <img src="images/svg icons/volume-high.svg" width="24" heigh="24">
                <input type="range" class="form-range volume-slider" id="volumeSlider" min="0" max="100" value="100">
            </div>
        </div>
    </div>

    <!-- Hidden Audio Player -->
    <audio id="audioPlayer"></audio>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        // ============ STATE ============
        let songs = [];
        let currentSongIndex = -1;
        let isPlaying = false;
        let playlists = JSON.parse(localStorage.getItem('echoPlaylists')) || [];
        const audioPlayer = document.getElementById('audioPlayer');
        let dragState = null;

        // ============ INITIALIZATION ============
        document.addEventListener("DOMContentLoaded", function () {
            loadSongs();
            setupEventListeners();
            observeSections();
            setupScrollDragger();
        });

        function setupEventListeners() {
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');

            // Click to upload
            uploadZone.addEventListener('click', () => fileInput.click());

            // File selection
            fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

            // Drag and drop
            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadZone.classList.add('dragover');
            });

            uploadZone.addEventListener('dragleave', () => {
                uploadZone.classList.remove('dragover');
            });

            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });

            // Audio player events
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', nextSong);
            audioPlayer.addEventListener('loadedmetadata', updateDuration);

            // Progress bar
            document.getElementById('progressBar').addEventListener('click', seek);

            // Volume
            document.getElementById('volumeSlider').addEventListener('input', (e) => {
                audioPlayer.volume = e.target.value / 100;
            });
        }

        function setupScrollDragger() {
            const mainContent = document.getElementById('mainContent');
            const dragger = document.getElementById('scrollDragger');
            const rail = document.getElementById('scrollRail');
            const thumb = document.getElementById('scrollThumb');
            const upBtn = document.getElementById('scrollUpBtn');
            const downBtn = document.getElementById('scrollDownBtn');

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function updateThumb() {
                const maxScroll = mainContent.scrollHeight - mainContent.clientHeight;
                if (maxScroll <= 0) {
                    dragger.classList.add('hidden');
                    return;
                }
                dragger.classList.remove('hidden');

                const railHeight = rail.clientHeight;
                const thumbHeight = clamp((mainContent.clientHeight / mainContent.scrollHeight) * railHeight, 36, railHeight);
                thumb.style.height = `${thumbHeight}px`;

                const maxThumbTop = Math.max(railHeight - thumbHeight, 1);
                const ratio = mainContent.scrollTop / maxScroll;
                thumb.style.top = `${ratio * maxThumbTop}px`;
            }

            function setScrollFromThumb(top) {
                const railHeight = rail.clientHeight;
                const thumbHeight = thumb.offsetHeight;
                const maxThumbTop = Math.max(railHeight - thumbHeight, 1);
                const nextTop = clamp(top, 0, maxThumbTop);
                const ratio = nextTop / maxThumbTop;
                const maxScroll = Math.max(mainContent.scrollHeight - mainContent.clientHeight, 0);
                mainContent.scrollTop = ratio * maxScroll;
            }

            thumb.addEventListener('mousedown', (e) => {
                e.preventDefault();
                dragState = {
                    startY: e.clientY,
                    startTop: parseFloat(thumb.style.top) || 0
                };
                thumb.classList.add('dragging');
            });

            document.addEventListener('mousemove', (e) => {
                if (!dragState) return;
                const delta = e.clientY - dragState.startY;
                setScrollFromThumb(dragState.startTop + delta);
            });

            document.addEventListener('mouseup', () => {
                if (!dragState) return;
                dragState = null;
                thumb.classList.remove('dragging');
            });

            rail.addEventListener('click', (e) => {
                if (e.target === thumb) return;
                const rect = rail.getBoundingClientRect();
                const targetTop = e.clientY - rect.top - (thumb.offsetHeight / 2);
                setScrollFromThumb(targetTop);
            });

            upBtn.addEventListener('click', () => {
                mainContent.scrollBy({ top: -220, behavior: 'smooth' });
            });

            downBtn.addEventListener('click', () => {
                mainContent.scrollBy({ top: 220, behavior: 'smooth' });
            });

            mainContent.addEventListener('scroll', updateThumb);
            window.addEventListener('resize', updateThumb);
            window.refreshScrollDragger = updateThumb;
            updateThumb();
        }

        // ============ NAVIGATION ============
        function scrollToSection(sectionId) {
            const section = document.getElementById(sectionId);
            const mainContent = document.getElementById('mainContent');
            
            mainContent.scrollTo({
                top: section.offsetTop,
                behavior: 'smooth'
            });
            setTimeout(() => {
                if (typeof window.refreshScrollDragger === 'function') {
                    window.refreshScrollDragger();
                }
            }, 360);
        }

        function observeSections() {
            const sections = document.querySelectorAll('.section');
            const navItems = document.querySelectorAll('.nav-item');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        navItems.forEach(item => {
                            item.classList.remove('active');
                            if (item.getAttribute('onclick').includes(id)) {
                                item.classList.add('active');
                            }
                        });
                    }
                });
            }, { threshold: 0.5 });

            sections.forEach(section => observer.observe(section));
        }

        // ============ FILE HANDLING ============
        function handleFiles(files) {

    let filesAdded = 0;
    const totalFiles = Array.from(files).filter(f => f.type.startsWith("audio/")).length;
    const firstSongIndex = songs.length;

    for (let file of files) {

        if (!file.type.startsWith("audio/")) continue;

        const songName = file.name.replace(/\.[^/.]+$/, '');

        // duplicate check
        const alreadyExists = songs.some(song => song.name === songName);

        if (alreadyExists) {
            const confirmAdd = confirm("The track has already been added. Add anyway?");
            if (!confirmAdd) continue;
        }

        const song = {
            id: Date.now() + Math.random(),
            name: songName,
            artist: "Unknown Artist",
            url: URL.createObjectURL(file)
        };

        songs.push(song);
        filesAdded++;
    }

    // render once after loop
    renderSongs();

    // autoplay first uploaded track
    if (filesAdded > 0) {
        scrollToSection("home");

        setTimeout(() => {
            playSong(firstSongIndex);
        }, 300);
    }

    // reset file input so same file can be uploaded again
    document.getElementById("fileInput").value = "";
}


        // ============ STORAGE ============
        function saveSongs() {
            localStorage.setItem('musicPlayerSongs', JSON.stringify(songs));
        }

        function loadSongs() {
            const saved = localStorage.getItem('musicPlayerSongs');
            if (saved) {
                songs = JSON.parse(saved);
            }
            renderSongs(); // ← always render
        }

        // ============ RENDERING ============
        function renderSongs() {
            const songList = document.getElementById('songList');
            
            if (songs.length === 0) {
                songList.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-emoji">🎵</span>
                        <h5>No songs yet</h5>
                        <p>Upload your music to get started</p>
                    </div>
                `;
                if (typeof window.refreshScrollDragger === 'function') window.refreshScrollDragger();
                return;
            }

            songList.innerHTML = songs.map((song, index) => `
                <div class="song-item ${currentSongIndex === index && isPlaying ? 'playing' : ''}" onclick="playSong(${index})">
                    <div class="song-info">
                        <div class="song-icon">
                            ${currentSongIndex === index && isPlaying 
                                ? icons.playingmusic 
                                : icons.defaultMusic}
                        </div>
                        <div class="song-details">
                            <h6>${song.name}</h6>
                            <p>${song.artist}</p>
                        </div>
                    </div>
                    <div class="song-actions">
                        <button onclick="deleteSong(${index}, event)" title="Delete">
                            ${icons.delete}
                        </button>
                    </div>
                </div>
            `).join('');
            if (typeof window.refreshScrollDragger === 'function') window.refreshScrollDragger();
        }
        // ============ ICONS STORAGE ============
        // ============ ICONS STORAGE ============
// ============ ICONS STORAGE ============
const icons = {
    // Standardizing all sizes for consistency
    play: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>`,

};


        // ============ PLAYBACK ============

            function updatePlayPauseUI() {
                const playBtn = document.getElementById('playPauseBtn');
                const progressBar = document.getElementById("progressBar");

                playBtn.innerHTML = isPlaying
        ? '<i class="bi bi-pause-fill fs-4"></i>'
        : '<i class="bi bi-play-fill fs-4"></i>';
}

function playSong(index) {
    if (!songs[index]) return;

    currentSongIndex = index;

    audioPlayer.pause();
    audioPlayer.currentTime = 0;
    audioPlayer.src = songs[index].url;
    audioPlayer.load();
    audioPlayer.play();

    isPlaying = true;

    document.getElementById('currentSongName').textContent = songs[index].name;
    document.getElementById('currentSongArtist').textContent = songs[index].artist;

    updatePlayPauseUI();
    renderSongs();
}

        function togglePlayPause() {

    if (songs.length === 0) return;

    if (currentSongIndex === -1) {
        playSong(0);
        return;
    }

    if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
    } else {
        audioPlayer.play();
        isPlaying = true;
    }
    
    updatePlayPauseUI(); // Updates the icon correctly
    renderSongs();
}

        function nextSong() {
    if (songs.length === 0) return;

    currentSongIndex++;

    if (currentSongIndex >= songs.length) {
        currentSongIndex = 0;
    }

    playSong(currentSongIndex);
}

        function previousSong() {
            if (songs.length === 0) return;
            const prevIndex = currentSongIndex === 0 ? songs.length - 1 : currentSongIndex - 1;
            playSong(prevIndex);
        }

        function updateProgress() {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentTime').textContent = formatTime(audioPlayer.currentTime);
        }

        function updateDuration() {
            document.getElementById('totalTime').textContent = formatTime(audioPlayer.duration);
        }

        function seek(e) {
            const bar = document.getElementById('progressBar');
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ============ SONG MANAGEMENT ============
        function deleteSong(index, event) {
            event.stopPropagation();
            if (confirm('Delete this song?')) {
                songs.splice(index, 1);
                if (currentSongIndex === index) {
                    audioPlayer.pause();
                    currentSongIndex = -1;
                    isPlaying = false;
                    // Change this line from icons.delete to icons.play
                    document.getElementById('playPauseBtn').innerHTML = icons.play; 
                    document.getElementById('currentSongName').textContent = 'No song playing';
                    document.getElementById('currentSongArtist').textContent = '---';
                }
                saveSongs();
                renderSongs();
            }
        }

        // ============ PLAYLISTS ============
        function createPlaylist() {
            const name = prompt('Enter playlist name:');
            if (name && name.trim() !== "") {
                const newPlaylist = {
                    id: Date.now(),
                    name: name,
                    songs: []
                };
                playlists.push(newPlaylist);
                localStorage.setItem('echoPlaylists', JSON.stringify(playlists));
                renderPlaylists(); // Refresh the view
            }
        }

        function renderPlaylists() {
            const grid = document.querySelector('.playlist-grid');
            // We keep the "Create" button and then add the new playlists
            grid.innerHTML = `
                <div class="playlist-card create-playlist" onclick="createPlaylist()">
                    <img src="images/svg icons/create.svg" alt="Create" width="32" height="32">
                    <h5>Create Playlist</h5>
                </div>
            `;

            playlists.forEach(playlist => {
                grid.innerHTML += `
                    <div class="playlist-card">
                        <img src="images/svg icons/folder-kanban.svg" alt="Playlist" width="32" height="32" style="margin-bottom: 10px;">
                        <h5>${playlist.name}</h5>
                        <small style="color: #999;">${playlist.songs.length} songs</small>
                    </div>
                `;
            });
            if (typeof window.refreshScrollDragger === 'function') window.refreshScrollDragger();
        }

        // ============ AUTH ============
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }
    </script>
